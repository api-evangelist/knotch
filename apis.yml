- aid: knotch:unit-api
  name: Knotch Measurement Unit API
  description: >-
    Browser-side JavaScript API exposed by the Knotch tag for controlling Measurement Units on a
    page at runtime: Knotch.addUnit(), Knotch.removeUnit(), Knotch.setFocus(), Knotch.enableUnit(),
    Knotch.disableUnit() and Knotch.setOptout(). Paired with the knotch-ignore HTML attribute, which
    holds a placeholder container back from injecting a Unit until the publisher explicitly enables it.
  humanURL: https://docs.knotch.it/unit_api/
  baseURL: https://www.knotch-cdn.com
  tags:
  - JavaScript
  - Measurement
  - Consent
  properties:
  - type: Documentation
    url: https://docs.knotch.it/unit_api/
  - type: Components
    url: components/knotch-components.yml
- aid: knotch:event-pixel
  name: Knotch Event Pixel
  description: >-
    HTTP beacon endpoint for signalling arbitrary events from a web page — conversion events, site
    journey steps and visitor signals. A single GET to the collection host with account_id, event
    and optional page_url and ts query parameters, implementable as an inline <img>, a dynamic
    Image() in JavaScript, or an event-delegated handler.
  humanURL: https://docs.knotch.it/event_pixel/
  baseURL: https://t.knotch.it
  tags:
  - Pixel
  - Events
  - Conversion Tracking
  properties:
  - type: Documentation
    url: https://docs.knotch.it/event_pixel/
- aid: knotch:verification-pixel
  name: Knotch Verification Pixel
  description: >-
    Publisher traffic verification tag, a component of Knotch Blueprint. A single script element
    carrying a data-kvpid attribute, fired once on document onLoad, collecting page views, unique
    visitors and basic browser metrics. Identifiers are first-party cookies and are explicitly not
    shared with the Knotch Measurement product.
  humanURL: https://docs.knotch.it/verification_pixel/
  baseURL: https://www.knotch-cdn.com
  tags:
  - Pixel
  - Verification
  - Publishers
  properties:
  - type: Documentation
    url: https://docs.knotch.it/verification_pixel/
  - type: Components
    url: components/knotch-components.yml
