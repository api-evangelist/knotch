image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/knotch.png
name: Knotch
description: >-
  Knotch is a New York-based content intelligence company founded by Anda Gansca and Aron Tzimas.
  Its Knotch One platform measures and optimizes owned-content performance for enterprise marketing
  teams, and its newer product, Ace, is positioned as AI experience infrastructure for the
  conversational web: it ingests a brand's existing web properties, content hubs, video and feeds,
  atomizes them into modular content units tagged by topic, audience, funnel stage and intent, then
  composes adaptive page experiences for human visitors while emitting structured, citable content
  for AI agents and answer engines. Named enterprise customers include Google, Deloitte, Ally,
  Zillow, Cox Automotive, GEICO, Synchrony, Square, Dropbox, FOX and Chime. Knotch does publish a
  developer surface, on two hosts that are not linked from the marketing site: docs.knotch.it
  documents the browser-side Measurement Unit API, Event Pixel and Verification Pixel, and
  help.knotch.com documents the server-side Knotch Events API v1.1, which accepts batched
  conversion events over HTTPS with Bearer authentication and is backed by a live OpenAPI 3.1.0
  definition served at https://events.knotch.it/openapi.json. Credentials are issued by Client
  Success rather than self-service, and no pricing, status page, changelog, SDK or public GitHub
  organization is published.
