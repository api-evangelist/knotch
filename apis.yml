apis:
- aid: knotch:events-api
  name: Knotch Events API
  description: >-
    Server-side conversion event ingestion. Accepts batches of up to 100 events over HTTPS with
    Bearer authentication, so conversions that happen off-site (CRM milestones such as ClosedWon,
    BecameSQL or Renewal, data-warehouse or marketing-automation outcomes) can be measured and
    attributed alongside on-site conversions in Knotch One, where they surface as "API Conversions".
    A simulate=true query parameter validates a payload without storing data. A Segment Webhook
    destination endpoint is also supported and is the only path present in the published OpenAPI.
  humanURL: https://help.knotch.com/en/articles/159-events-api-v11-technical-overview
  baseURL: https://events.knotch.it
  tags:
  - Events
  - Conversions
  - Attribution
  properties:
