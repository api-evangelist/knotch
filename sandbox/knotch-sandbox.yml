method: searched
source: https://help.knotch.com/en/articles/159-events-api-v11-technical-overview
note: >-
  Knotch ships a validation-only simulation mode rather than a separate sandbox environment. There
  is no test host, no test-vs-live key prefix, and no fixture data. Everything below is published
  by Knotch; no test values have been invented.
separation:
  model: same host, same credentials, request-scoped flag
  test_host: null
  live_host: https://events.knotch.it
  key_prefixes: null
  note: >-
    The same production API key and the same production endpoint are used for both simulated and
    live requests. The only thing that separates them is a query parameter, which means a
    mistyped or omitted flag writes real data.
simulation:
  parameter: simulate
  location: query
  type: boolean
  default: false
  values:
    'true': validates structure, required fields and authentication without storing any data
    'false': ingests the batch
  success_response:
    status: 200
    body: '{"message": "Events validated successfully"}'
  documented_as: >-
    "You can safely test your integration by setting simulate=true. This validates structure,
    required fields, and authentication without storing any data."
  in_openapi: true
  openapi_parameter: openapi/knotch-events-api-openapi.yml#/paths/~1conversion_events~1segment~1{account_id}/post/parameters/1
test_fields:
- name: test_event_code
  location: events[] item
  documented_in: the payload schema example in the Events API v1.1 technical overview
  in_schema: false
  example_value: TEST123
  caveat: >-
    This field appears in Knotch's published example payload but is NOT present in the CustomEvent
    schema of the live OpenAPI, and Knotch's own field definition table does not describe it. Its
    behaviour is undocumented. Recorded here because Knotch publishes it, not because it is verified.
health_check:
  operation: health_check_health_get
  method: GET
  path: /health
  auth: none
  use: >-
    Unauthenticated liveness probe on the production host. Usable to confirm reachability before
    an integration is credentialed.
  source: openapi/knotch-events-api-openapi.yml
