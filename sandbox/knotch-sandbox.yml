gaps:
- No sandbox environment, no test host, no test API key, no test account.
- No test-mode key prefix, so a key cannot be identified as test or live by inspection.
- No time simulation, no event triggers, no seeded fixture data.
- simulate defaults to false, so an omitted parameter writes production data.
- The Event Pixel and Verification Pixel have no simulation mode at all.
