live_examples:
  note: >-
    Knotch links "live example" pages from each documentation page (Unit API, Event Pixel,
    Verification Pixel) that demonstrate the integration in a real browser.
  pages:
  - https://docs.knotch.it/unit_api/
  - https://docs.knotch.it/event_pixel/
