note: >-
  Knotch publishes exactly one quantitative constraint on the Events API — a batch size cap — and
  no request-rate limit at all. No rate-limit response headers, no 429, and no quota are
  documented on any Knotch surface. Recorded as searched with an honest near-zero rather than
  omitted, because the absence is the finding.
