    server error.
retry_guidance:
  published: partial
  detail: >-
    Knotch documents retry behaviour only for the Segment path — "Segment retries failed posts
    with exponential backoff" — describing what Segment does, not what Knotch requires. No retry
    or backoff guidance is published for direct API callers. Retries are nonetheless safe because
    of the event_id deduplication contract (duplicates return 409).
  see: conventions/knotch-conventions.yml
