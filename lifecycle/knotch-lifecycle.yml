data_retention:
  published: true
  url: https://help.knotch.com/en/articles/53-what-is-knotch-s-data-retention-policy
  policy: >-
    Data is preserved indefinitely during an active customer relationship. If an account is
    voluntarily closed it enters an expired state, and data from expired accounts is retained
    until the contract end date, after which it is destroyed upon request or at Knotch's discretion.
  soft_delete: >-
    Deleting an API Conversion is a soft delete: events disappear from dashboards and tables
    within about an hour, but the raw event data ingested through the Events API remains stored in
    the account and the conversion can be re-created without re-sending events.
  soft_delete_source: https://help.knotch.com/en/articles/161-creating-and-managing-api-conversion-events
data_freshness:
  note: >-
    Attributed content metrics on the Conversions Leaderboard refresh every 24 hours; ingestion
    itself is synchronous.
