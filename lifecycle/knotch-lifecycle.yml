note: >-
  Knotch's operational transparency is thin. The API is versioned only in the title of a help
  centre article; there is no status page, no changelog, no deprecation policy, no Sunset header
  support and no published SLA. The one lifecycle commitment Knotch does publish is a data
  retention policy for customer data.
