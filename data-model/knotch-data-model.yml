path_parameters:
- {name: account_id, type: string, note: 'Knotch Measurement Account ID; scopes the event to a tenant'}
identifier_conventions:
  event_id: client-supplied, opaque string, example documented as an opportunity id (OPP-12345)
  account_id: >-
    Knotch's published examples show two different shapes for the same concept — a 24-character
    hex string in the Event Pixel documentation (56045b7062ec9c4e0a2b7443) and a UUID-shaped
    string in the Events API cURL example. Knotch does not document which form is canonical.
downstream_concepts:
  note: >-
    These are not API entities but are how ingested events surface in the Knotch One product, per
    the Event Builder documentation.
  concepts:
  - {name: API Conversion, detail: 'an Event Builder definition bound to one ingested event_name; appears alongside Site Conversions'}
  - {name: Site Conversion, detail: on-site conversion captured by the Knotch tag}
  - {name: Action, detail: on-site interaction event}
gaps:
- No read, list, update or delete operations exist, so the model cannot be traversed from the API.
- The documented payload example shows a "test_event_code" field that is absent from the
  published schema; the schema conversely defines click_ids, which the documented example omits.
- The documented example passes identity.gclid both as an object and, in the cURL example, as a
  bare string; the schema requires the object form.
