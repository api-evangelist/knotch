root: CustomEvents
entities:
- name: CustomEvents
  role: request envelope
  description: The batch wrapper posted to the conversion events endpoint.
  fields:
  - {name: events, type: array<CustomEvent>, required: true, constraint: '1-100 items'}
- name: CustomEvent
  role: event record
  description: One conversion or engagement event.
  fields:
  - {name: event, type: EventData, required: true}
  - {name: identity, type: Identity, required: true}
  - {name: value, type: Value, required: false}
  - {name: event_source, type: array<string>, required: false, example: '[Salesforce, Marketo]'}
  - {name: click_ids, type: ClickIds, required: false}
- name: EventData
  role: event descriptor
  fields:
  - {name: event_name, type: string, required: true, note: 'must match a saved Event Builder definition, e.g. ClosedWon, BecameSQL, AdClick'}
  - {name: timestamp, type: integer, required: true, note: UTC Unix epoch seconds}
  - {name: event_id, type: string, required: true, note: 'unique identifier for the event; the deduplication key'}
- name: Identity
  role: identity resolution keys
  description: >-
    The identifiers Knotch resolves an inbound event against. Every field is optional in the
    schema, but the documentation requires at least one to be populated. Knotch also notes that
    only a single custom ID is currently supported and it must be the ID agreed at integration time.
  fields:
  - {name: kn_cs_visitor_id, type: string, required: false, note: Knotch visitor identifier}
  - {name: gclid, type: Gclid, required: false, note: Google Click ID, with first/last seen}
  - {name: ecid, type: string, required: false, note: Adobe Experience Cloud ID}
  - {name: ga_client_id, type: string, required: false, note: Google Analytics client ID}
  - {name: marketo_lead_id, type: string, required: false, note: Marketo lead ID}
- name: Gclid
  role: click identifier with observation window
  fields:
  - {name: value, type: string|null}
  - {name: first_seen, type: integer|null, note: UTC Unix epoch seconds}
  - {name: last_seen, type: integer|null, note: UTC Unix epoch seconds}
- name: ClickIds
  role: paid-media click identifier bundle
  fields:
  - {name: msclkid, type: ClickId|null, note: Microsoft Advertising}
  - {name: fbclid, type: ClickId|null, note: Meta}
  - {name: ttclid, type: ClickId|null, note: TikTok}
  - {name: li_fat_id, type: ClickId|null, note: LinkedIn}
- name: ClickId
  role: single click identifier
  fields:
  - {name: value, type: string, required: true}
- name: Value
  role: monetary or numeric outcome
  fields:
  - {name: value, type: number|null, note: 'revenue or numeric value; aggregated with sum, currency assumed USD'}
- name: HTTPValidationError
  role: error envelope
  fields:
  - {name: detail, type: array<ValidationError>}
- name: ValidationError
  role: field-level validation failure
  fields:
